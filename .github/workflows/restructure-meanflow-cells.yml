name: Restructure mean_flow_experiment1 cells

on:
  push:
    paths:
      - '.github/workflows/restructure-meanflow-cells.yml'

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restructure notebook cells by role
        run: python .github/scripts/restructure_meanflow_cells.py
      - name: Validate notebook JSON
        run: python -m json.tool mean_flow_experiment1.ipynb > /dev/null
      - name: Commit notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mean_flow_experiment1.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes"
          else
            git commit -m "Restructure MeanFlow notebook cells by role"
            git push
          fi
