name: upgrade-meanflow-experiment1

on:
  push:
    branches:
      - fix/meanflow-experiment1-official-settings

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meanflow-experiment1-official-settings
          fetch-depth: 0
      - name: Patch notebook
        run: python scripts/patch_meanflow_experiment1.py
      - name: Commit patched notebook and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/workflows/upgrade_meanflow_experiment1.yml scripts/patch_meanflow_experiment1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mean_flow_experiment1.ipynb .github/workflows/upgrade_meanflow_experiment1.yml scripts/patch_meanflow_experiment1.py
          git commit -m "fix: align experiment1 with conditional MeanFlow settings"
          git push origin HEAD:fix/meanflow-experiment1-official-settings
