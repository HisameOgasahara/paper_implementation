name: Format mean_flow_experiment1

on:
  push:
    paths:
      - ".github/workflows/format-mean-flow-experiment1.yml"

permissions:
  contents: write

jobs:
  format-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Black
        run: python -m pip install black==25.1.0

      - name: Format notebook code cells
        run: python .github/scripts/format_mean_flow_experiment1.py

      - name: Remove temporary formatter files
        run: |
          rm .github/scripts/format_mean_flow_experiment1.py
          rm .github/workflows/format-mean-flow-experiment1.yml

      - name: Commit formatted notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mean_flow_experiment1.ipynb .github
          git commit -m "Standardize mean_flow_experiment1 notebook style"
          git push
