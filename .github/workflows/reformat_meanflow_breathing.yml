name: reformat-meanflow-breathing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reformat:
    if: "!contains(github.event.head_commit.message, '[breathing-pass]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reformat notebook
        run: python scripts/reformat_meanflow_breathing.py

      - name: Commit notebook and remove one-shot helpers
        shell: bash
        run: |
          rm -f scripts/reformat_meanflow_breathing.py
          rm -f .github/workflows/reformat_meanflow_breathing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mean_flow_experiment1.ipynb scripts/reformat_meanflow_breathing.py .github/workflows/reformat_meanflow_breathing.yml
          git commit -m "style: add breathing room to MeanFlow notebook [breathing-pass]"
          git push origin HEAD:main
