name: Patch MeanFlow experiment notebook

on:
  push:
    paths:
      - '.github/workflows/patch_mean_flow_experiment1.yml'

permissions:
  contents: write

jobs:
  patch-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch notebook
        run: |
          sed -i '/        if ";" in stripped and not stripped.startswith("!"):$/,+3d' .github/patch_meanflow.py
          python .github/patch_meanflow.py

      - name: Commit patched notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix MeanFlow JVP helpers and add early stopping"
          git push
