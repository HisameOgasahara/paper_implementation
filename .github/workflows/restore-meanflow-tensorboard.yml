name: Restore MeanFlow TensorBoard

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-notebook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply notebook payload
        run: python .github/scripts/apply_meanflow_notebook.py

      - name: Commit notebook fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mean_flow_sanity_check.ipynb
          git commit -m 'Restore TensorBoard and Colab GPU metadata'
          git push origin HEAD:main
