name: reformat-meanflow-experiment1

on:
  push:
    branches:
      - fix/meanflow-experiment1-readability

permissions:
  contents: write

jobs:
  reformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meanflow-experiment1-readability
          fetch-depth: 0
      - name: Reformat notebook
        run: python scripts/reformat_meanflow_experiment1.py
      - name: Commit notebook and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/reformat_meanflow_experiment1.yml scripts/reformat_meanflow_experiment1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mean_flow_experiment1.ipynb .github/workflows/reformat_meanflow_experiment1.yml scripts/reformat_meanflow_experiment1.py
          git commit -m "style: split MeanFlow notebook into readable cells"
          git push origin HEAD:fix/meanflow-experiment1-readability
