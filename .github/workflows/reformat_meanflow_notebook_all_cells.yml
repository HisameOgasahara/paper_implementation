name: reformat-meanflow-notebook-all-cells

on:
  push:
    branches:
      - audit/meanflow-notebook-all-cells

permissions:
  contents: write

jobs:
  audit-and-reformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/meanflow-notebook-all-cells
          fetch-depth: 0

      - name: Install formatter
        run: pip install black

      - name: Reformat every code cell and audit readability
        run: python scripts/reformat_meanflow_notebook_all_cells.py

      - name: Commit notebook and remove one-shot helpers
        shell: bash
        run: |
          rm -f scripts/reformat_meanflow_notebook_all_cells.py
          rm -f .github/workflows/reformat_meanflow_notebook_all_cells.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mean_flow_experiment1.ipynb scripts/reformat_meanflow_notebook_all_cells.py .github/workflows/reformat_meanflow_notebook_all_cells.yml
          git commit -m "style: reformat every MeanFlow notebook code cell"
          git push origin HEAD:audit/meanflow-notebook-all-cells
